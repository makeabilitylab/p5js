<!DOCTYPE html>
<html>

<head>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css">
  <meta charset="utf-8">
</head>

<body>
  <!-- Accessibility caption. The visible <p> shows the live mic level for
       everyone; it is NOT a live region, so screen readers don't announce it
       every frame (they can read it on demand). The hidden polite region
       announces only when the qualitative level changes (e.g. quiet -> loud). -->
  <p id="mic-level-text">Click the canvas to start the microphone.</p>
  <div id="mic-level-status" aria-live="polite"
       style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;"></div>
  <script src="sketch.js"></script>
</body>

</html>
