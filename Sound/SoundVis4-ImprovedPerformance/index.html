<!DOCTYPE html>
<html lang="en">

<head>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/p5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.13/lib/addons/p5.sound.min.js"></script>
  <script src="soundvis.js"></script>
  <script src="sketch.js"></script>

  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <meta charset="utf-8">
</head>

<body>
  <!-- Accessibility caption: visible <p> shows the live dominant frequency for
       everyone (not a live region). The hidden polite region announces only when
       the frequency band changes. -->
  <p id="freq-text">Waiting for audio…</p>
  <div id="freq-status" aria-live="polite"
       style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;"></div>
  <div class="w3-sidebar w3-light-grey w3-card-4 w3-animate-left" style="width:200px" id="sidebar">
    <div class="w3-bar w3-dark-grey">
      <span class="w3-bar-item w3-padding-16">SoundVis</span>
      <button onclick="closeSidebar()" class="w3-bar-item w3-button w3-right w3-padding-16"
        title="close Sidebar" aria-label="Close sidebar">&times;</button>
    </div>
    <div class="w3-bar-block">
      <span class="w3-bar-item">
        <input id="full-screen-checkbox" class="w3-check" type="checkbox" onchange="fullScreenModeChanged(this, event)">
        <label for="full-screen-checkbox">Go full screen</label>
      </span> 
    </div>
  </div>

  <div id="main" style="margin-left:200px">
    <div class="w3-container w3-display-container" style="padding:0px;"> <!-- add 0 padding here to have no left padding -->
      <span title="Expanded Sidebar" style="display:none" id="expanded-sidebar"
        class="w3-button w3-transparent w3-display-topleft w3-xlarge" onclick="openSidebar()">&#9776;</span>
      <div id="sketch-container">
      </div>
    </div>
  </div>

  <script>
    function openSidebar() {
      document.getElementById("main").style.marginLeft = "180px";
      document.getElementById("sidebar").style.width = "180px";
      document.getElementById("sidebar").style.display = "block";
      document.getElementById("expanded-sidebar").style.display = 'none';
    }

    function closeSidebar() {
      document.getElementById("main").style.marginLeft = "0";
      document.getElementById("sidebar").style.display = "none";
      document.getElementById("expanded-sidebar").style.display = "inline-block";
    }
  </script>
  
</body>

</html>
